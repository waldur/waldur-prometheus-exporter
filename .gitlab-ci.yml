Run linters:
  extends: .Run linters template

Generate Image SBOM:
  extends: .Generate Image SBOM template

Generate Codebase SBOM:
  extends: .Generate Codebase SBOM template

Publish SBOMs to GitHub release:
  extends: .Publish SBOMs to GitHub release template

Release tag:
  extends: .release-tag-base
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  before_script:
    - apt-get update && apt-get install -y git
    - !reference [.release-tag-base, before_script]
  script:
    - pip install uv
    # Safely poll PyPI's JSON API directly
    - |
      git tag -a $RELEASE_VERSION -m "Release $RELEASE_VERSION" || echo "Tag already exists"
      git push origin $RELEASE_VERSION || echo "Tag already pushed"

# Fails when a dependency arrives under a licence Waldur cannot ship — strong
# copyleft (GPL, AGPL), source-available (SSPL, BUSL, Elastic) or non-OSI
# use-restricted (Hippocratic, JSON). LGPL and MPL pass but stay listed in the
# job artifact. See waldur/waldur-mastermind#285.
#
# The job only runs on merge requests that touch pyproject.toml or uv.lock, plus
# the default branch and release tags.
#
# allow_failure is inherited as true from the template, so this cannot redden an
# MR while it is being adopted. Override it with `allow_failure: false` to make
# the gate binding once this repo is known clean.
Check dependency licences:
  extends: .Licence gate (python) template
